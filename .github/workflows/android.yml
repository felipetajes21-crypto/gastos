name: App Android

# Compila o app Android (com o widget) e publica o APK em
# https://github.com/<dono>/gastos/releases/download/app/gastos.apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Falta o segredo ANDROID_KEYSTORE_B64 (chave que assina o app)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gastos.keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/gastos.keystore" gradle --no-daemon assembleRelease
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gastos.apk
          gh release view app >/dev/null 2>&1 || gh release create app --target "$GITHUB_SHA" --title "App Android (Gastos)" \
            --notes "Baixe o gastos.apk no celular Android e instale. Depois segure a tela inicial → Widgets → Gastos."
          gh release upload app gastos.apk --clobber
