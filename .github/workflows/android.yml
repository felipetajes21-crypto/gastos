name: App Android

# Compila o app Android (com o widget) e publica o APK em
# https://github.com/<dono>/gastos/releases/download/app/gastos.apk
on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          # a senha sozinha não serve para nada: o que protege é o arquivo da chave, que fica só no segredo
          KEYSTORE_PASSWORD: gastos-assinatura
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # sem a chave: só confere se compila (versão de teste, não é publicada)
            echo "::warning::Falta o segredo ANDROID_KEYSTORE_B64 (Settings → Secrets and variables → Actions). Compilando só para teste."
            gradle --no-daemon assembleDebug
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gastos.keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/gastos.keystore" gradle --no-daemon assembleRelease
      - name: Publicar APK
        if: github.ref == 'refs/heads/main' && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gastos.apk
          gh release view app >/dev/null 2>&1 || gh release create app --target "$GITHUB_SHA" --title "App Android (Gastos)" \
            --notes "Baixe o gastos.apk no celular Android e instale. Depois segure a tela inicial → Widgets → Gastos."
          gh release upload app gastos.apk --clobber
